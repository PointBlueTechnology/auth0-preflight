name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run lint:self

  # Exercises action.yml the way another repo would use it.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean export passes with no warnings allowed
        uses: ./
        with:
          path: test/fixtures/clean
          max-warnings: 0

      - name: Example passes when warnings are allowed
        uses: ./
        with:
          path: examples/change-email

      - name: Example fails when no warnings are allowed
        id: strict
        continue-on-error: true
        uses: ./
        with:
          path: examples/change-email
          max-warnings: 0

      - name: Check the strict run failed
        if: steps.strict.outcome != 'failure'
        run: |
          echo "::error::expected the strict run to fail, got ${{ steps.strict.outcome }}"
          exit 1
